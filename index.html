<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5f5e"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><title>Lector de Libros</title>
<style>
:root{--bg:#f2f4f1;--card:#fff;--ink:#1c2a2a;--mut:#667776;--ac:#0e6f6d;--on:#fff;--sen:#cfe9e6;--wd:#0e6f6d;--wdt:#fff;--ln:#d5dcd9;--fs:20px;--ff:Georgia,'Noto Serif',serif}
.dk{--bg:#101516;--card:#182022;--ink:#d4dcdb;--mut:#8aa09f;--ac:#5fd1c8;--on:#08201f;--sen:#1d3a3a;--wd:#f5b83d;--wdt:#1a1400;--ln:#2a3638}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.v{display:none;height:100dvh;flex-direction:column}.v.on{display:flex}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;gap:8px;align-items:center}
h1{font-size:22px;margin:0;flex:1}
#lib main{flex:1;overflow:auto;padding:0 16px 96px}
input[type=search]{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--card)}
.chips{display:flex;gap:6px;margin:10px 0;overflow:auto}.chips button{border-radius:20px;padding:6px 14px;white-space:nowrap}.chips .on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.bk{cursor:pointer}.bk img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 2px 8px #0004;background:var(--ln);display:block}
.bk b{display:block;font-size:13px;margin-top:6px;line-height:1.2;max-height:2.4em;overflow:hidden}
.bar{height:4px;background:var(--ln);border-radius:2px;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.cont{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px}
.cont img{width:56px;aspect-ratio:2/3;object-fit:cover;border-radius:4px}.cont div{flex:1;min-width:0}.cont small{color:var(--mut)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));padding:14px 20px;border-radius:30px;box-shadow:0 4px 14px #0005}
.empty{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.5}
#rd header{padding-bottom:6px;border-bottom:1px solid var(--ln)}#rd header b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#txt{flex:1;overflow:auto;padding:18px 20px 40vh;font:var(--fs)/1.75 var(--ff);max-width:44rem;width:100%;margin:0 auto}
#txt p{margin:0 0 1em}.s{border-radius:4px;transition:background .2s}.s.cs{background:var(--sen)}.w.cw{background:var(--wd);color:var(--wdt);border-radius:3px}
.ctl{padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);background:var(--card);display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;justify-content:center}.row input[type=range]{flex:1;accent-color:var(--ac)}
#clk{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);text-align:center;cursor:pointer}#clk.run{color:var(--ac);font-weight:700}
#play{width:64px;height:48px;font-size:20px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#0008}dialog label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}dialog select,dialog input[type=number]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:9;display:none}
</style></head><body>
<section id="lib" class="v on">
<header><h1>Mi biblioteca</h1><button id="bTheme" title="Tema">◐</button></header>
<main><div id="cont"></div><input type="search" id="q" placeholder="Buscar libro…">
<div class="chips" id="chips"></div><div class="grid" id="grid"></div></main>
<button class="fab p" id="bAdd">+ Importar libros</button>
<input type="file" id="file" accept=".pdf,.epub,application/pdf,application/epub+zip" multiple hidden>
</section>
<section id="rd" class="v">
<header><button id="bBack">←</button><b id="rt"></b><button id="bSet">Ajustes</button></header>
<div id="txt"></div>
<div class="ctl">
<div id="clk"></div>
<div class="row"><button id="pPrev">«</button><button id="sPrev">⏮</button><button id="play" class="p">▶</button><button id="sNext">⏭</button><button id="pNext">»</button></div>
<div class="row"><button id="bPg" style="min-width:110px"></button><span>🐢</span><input type="range" id="rate" min=".5" max="2.5" step=".1"><span>🐇</span><b id="rv" style="width:38px"></b></div>
</div></section>
<dialog id="dBook"></dialog>
<dialog id="dSet"><b>Ajustes de lectura</b>
<label>Voz</label><select id="voz"></select>
<label>Tamaño de letra</label><div class="row"><button id="fm">A−</button><button id="fp">A+</button></div>
<label><input type="checkbox" id="asc" checked> Desplazamiento automático</label>
<p class="row"><button class="p" onclick="dSet.close()">Listo</button></p></dialog>
<dialog id="dPg"><b>Ir a la página</b><label id="pgl"></label>
<input type="number" id="pgn" min="1"><input type="range" id="pgr" min="1" style="width:100%;margin-top:10px;accent-color:var(--ac)">
<div id="chp"></div><p class="row"><button onclick="dPg.close()">Cancelar</button><button class="p" id="pgGo">Ir</button></p></dialog>
<div class="toast" id="toast"></div>
<script src="lib/pdf.min.js"></script><script src="lib/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
navigator.storage?.persist?.();
const st=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)};
const fmt=s=>{s=Math.floor(s);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const fh=s=>s<60?'menos de 1 min':s<3600?Math.round(s/60)+' min':(s/3600|0)+' h '+Math.round(s%3600/60)+' min';
// ---- tema
const setTheme=d=>{document.body.classList.toggle('dk',d);sv('dark',d)};setTheme(st('dark',matchMedia('(prefers-color-scheme:dark)').matches));
$('#bTheme').onclick=()=>setTheme(!st('dark'));
// ---- IndexedDB
const db=new Promise(r=>{const q=indexedDB.open('lector',1);q.onupgradeneeded=()=>{q.result.createObjectStore('books',{keyPath:'id'});q.result.createObjectStore('data')};q.onsuccess=()=>r(q.result)});
const tx=async(s,m,f)=>{const d=await db;return new Promise((a,b)=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>a(o.result);t.onerror=b})};
const put=(s,v,k)=>tx(s,'readwrite',o=>o.put(v,k)),get=(s,k)=>tx(s,'readonly',o=>o.get(k)),all=s=>tx(s,'readonly',o=>o.getAll()),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
// el avance se guarda en localStorage (síncrono) y en IndexedDB
const prog=b=>{const p=st('p:'+b.id);return p&&p.t>(b.t||0)?Object.assign(b,p):b};
const saveProg=b=>{b.t=Date.now();sv('p:'+b.id,{page:b.page,s:b.s,w:b.w,secs:b.secs,status:b.status,last:b.last,t:b.t});clearTimeout(saveProg.d);saveProg.d=setTimeout(()=>put('books',b),1500)};
// ---- Importar
const thumb=async(src,w=300)=>{const c=document.createElement('canvas');c.width=w;c.height=Math.round(w*src.height/src.width);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.75))};
const cleanPath=(dir,h)=>decodeURIComponent(new URL('http://x/'+dir+h.split('#')[0]).pathname.slice(1));
async function imp(file){
 const h=new Uint8Array(await file.slice(0,4).arrayBuffer()),pdf=h[0]==0x25;
 const m={id:crypto.randomUUID(),type:pdf?'pdf':'epub',title:file.name.replace(/\.\w+$/,''),author:'',status:'later',page:0,s:0,w:0,secs:0,added:Date.now()};
 if(pdf){
  const d=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;m.pages=d.numPages;
  try{const i=(await d.getMetadata()).info;if(i.Title)m.title=i.Title;m.author=i.Author||''}catch{}
  const p=await d.getPage(1),v=p.getViewport({scale:1}),vp=p.getViewport({scale:400/v.width}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;m.cover=await thumb(c);await put('data',file,m.id);
 }else{
  const z=await JSZip.loadAsync(file),rd=p=>z.file(p)||z.file(new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$','i'))[0];
  const xml=async(p,t='text/xml')=>new DOMParser().parseFromString(await rd(p).async('string'),t);
  const root=(await xml('META-INF/container.xml')).querySelector('rootfile').getAttribute('full-path'),dir=root.replace(/[^/]*$/,''),opf=await xml(root);
  m.title=opf.getElementsByTagName('dc:title')[0]?.textContent||m.title;m.author=opf.getElementsByTagName('dc:creator')[0]?.textContent||'';
  const man={};opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i);
  const cid=opf.querySelector('meta[name=cover]')?.getAttribute('content'),ci=[...Object.values(man)].find(i=>(i.getAttribute('properties')||'').includes('cover-image'))||man[cid];
  try{const f=rd(cleanPath(dir,ci.getAttribute('href')));m.cover=await thumb(await createImageBitmap(await f.async('blob')))}catch{}
  const pages=[],chap=[];
  for(const r of opf.querySelectorAll('spine > itemref')){
   const it=man[r.getAttribute('idref')];if(!it||!/html/.test(it.getAttribute('media-type')))continue;
   const f=rd(cleanPath(dir,it.getAttribute('href')));if(!f)continue;
   const doc=new DOMParser().parseFromString(await f.async('string'),'text/html');doc.querySelectorAll('script,style,nav').forEach(e=>e.remove());
   const sel='p,h1,h2,h3,h4,h5,h6,li,blockquote,div',ps=[...doc.body.querySelectorAll(sel)].filter(e=>!e.querySelector(sel)).map(e=>e.textContent.replace(/\s+/g,' ').trim()).filter(Boolean);
   if(!ps.length)continue;chap.push({t:doc.querySelector('h1,h2,h3')?.textContent.trim().slice(0,60)||'Sección '+(chap.length+1),p:pages.length});
   let cur=[],n=0;for(const t of ps){cur.push(t);n+=t.split(' ').length;if(n>=300){pages.push(cur);cur=[];n=0}}if(cur.length)pages.push(cur);
  }
  if(!pages.length)throw Error('sin texto');m.pages=pages.length;await put('data',{pages,chap},m.id);
 }
 await put('books',m);
}
$('#bAdd').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of e.target.files){toast('Importando '+f.name+'…');try{await imp(f)}catch(x){console.error(x);toast('No se pudo importar '+f.name)}}e.target.value='';toast('Importación terminada');render()};
// ---- Biblioteca
let filt='all';const ST={later:'Para después',reading:'Leyendo',done:'Terminado'};
const url=b=>b.cover?URL.createObjectURL(b.cover):(()=>{const c=document.createElement('canvas');c.width=200;c.height=300;const x=c.getContext('2d');x.fillStyle='#0e5f5e';x.fillRect(0,0,200,300);x.fillStyle='#fff';x.font='bold 20px Georgia';b.title.slice(0,50).match(/.{1,14}(\s|$)/g)?.slice(0,6).forEach((l,i)=>x.fillText(l.trim(),14,60+i*26));return c.toDataURL()})();
const pct=b=>b.pages?Math.round((b.page+(b.status=='done'?1:0))/b.pages*100):0;
async function render(){
 const bs=(await all('books')).map(prog).sort((a,b)=>(b.last||b.added)-(a.last||a.added)),q=$('#q').value.toLowerCase();
 $('#chips').innerHTML=[['all','Todos'],['reading','Leyendo'],['later','Para después'],['done','Terminados']].map(([k,t])=>`<button class="${filt==k?'on':''}" data-k="${k}">${t}</button>`).join('');
 $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{filt=b.dataset.k;render()});
 const last=bs.find(b=>b.last&&b.status!='done');
 $('#cont').innerHTML=last?`<div class="cont" id="cb"><img src="${url(last)}"><div><small>Continuar leyendo</small><br><b>${last.title}</b><div class="bar"><i style="width:${pct(last)}%"></i></div><small>Pág. ${last.page+1} de ${last.pages} · ${fh(last.secs)} leyendo</small></div><button class="p">Seguir</button></div>`:'';
 if(last)$('#cb').onclick=()=>open(last.id);
 const l=bs.filter(b=>(filt=='all'||b.status==filt)&&b.title.toLowerCase().includes(q));
 $('#grid').innerHTML=l.length?'':`<div class="empty" style="grid-column:1/-1">${bs.length?'Sin resultados.':'Tu biblioteca está vacía.<br>Toca <b>Importar libros</b> y elige PDF o EPUB de tu teléfono o de Google Drive.'}</div>`;
 l.forEach(b=>{const e=document.createElement('div');e.className='bk';e.innerHTML=`<img src="${url(b)}" alt=""><b>${b.title}</b><div class="bar"><i style="width:${pct(b)}%"></i></div>`;e.onclick=()=>info(b);$('#grid').append(e)});
}
$('#q').oninput=render;
function info(b){const d=$('#dBook'),p=pct(b),est=b.secs>120&&p>3?` · faltan ~${fh(b.secs/p*(100-p))}`:'';
 d.innerHTML=`<div class="cont" style="border:0;padding:0"><img src="${url(b)}"><div><b>${b.title}</b><br><small>${b.author}</small><br><small>${b.pages} páginas · ${p}%</small></div></div>
 <p>⏱ Tiempo total leyendo: <b>${fh(b.secs)}</b>${est}</p><label>Estado</label><select id="ss">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${b.status==k?'selected':''}>${v}</option>`).join('')}</select>
 <p class="row"><button id="bx">Eliminar</button><button id="bc">Cerrar</button><button class="p" id="bo">${b.page||b.secs?'Continuar':'Leer'}</button></p>`;
 d.showModal();$('#ss').onchange=e=>{b.status=e.target.value;saveProg(b);render()};$('#bc').onclick=()=>d.close();
 $('#bo').onclick=()=>{d.close();open(b.id)};$('#bx').onclick=async()=>{if(confirm('¿Eliminar "'+b.title+'" y su avance?')){await del('books',b.id);await del('data',b.id);localStorage.removeItem('p:'+b.id);d.close();render()}}}
// ---- Lector
let B,doc,epub,S=[],cur=0,cw=0,playing=false,tok=0,est,rate=st('rate',1),running=false,sess=0,tick;
const view=v=>{document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==v))};
async function open(id){
 B=prog(await get('books',id));const d=await get('data',id);
 if(B.type=='pdf')doc=await pdfjsLib.getDocument({data:await d.arrayBuffer()}).promise;else epub=d;
 B.status=B.status=='later'?'reading':B.status;$('#rt').textContent=B.title;sess=0;view('rd');
 await showPage(B.page,B.s,B.w);clearInterval(tick);tick=setInterval(clock,1000);clock();
}
async function pageParas(n){
 if(B.type=='epub')return epub.pages[n];
 const t=await(await doc.getPage(n+1)).getTextContent(),out=[];let c='',y=null;
 for(const i of t.items){if(!i.str&&!i.hasEOL)continue;const yy=i.transform[5],h=i.height||12;
  if(y!==null&&Math.abs(yy-y)>1){if(Math.abs(yy-y)>h*1.9&&c){out.push(c);c=''}else if(c.endsWith('-'))c=c.slice(0,-1);else c+=' '}c+=i.str;y=yy}
 if(c)out.push(c);return out.map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
}
function sentences(p){const o=[];for(const s of p.split(/(?<=[.!?…])\s+/)){if(s.length<=240){o.push(s);continue}let c='';for(const x of s.split(/(?<=[,;:])\s+/)){if(c&&(c+x).length>200){o.push(c);c=''}c+=(c?' ':'')+x}if(c)o.push(c)}return o}
async function showPage(n,s=0,w=0){
 stop();B.page=Math.max(0,Math.min(B.pages-1,n));const ps=await pageParas(B.page),box=$('#txt');box.innerHTML='';S=[];
 if(!ps.length)box.innerHTML='<p class="empty">Esta página no tiene texto (puede ser una imagen escaneada).</p>';
 ps.forEach(p=>{const pe=document.createElement('p');sentences(p).forEach((t,i,a)=>{const se=document.createElement('span'),ws=[];se.className='s';
  let last=0;for(const m of t.matchAll(/\S+/g)){if(m.index>last)se.append(' ');const we=document.createElement('span');we.className='w';we.textContent=m[0];se.append(we);ws.push({st:m.index,el:we});last=m.index+m[0].length}
  const o={el:se,text:t,words:ws,i:S.length};se.onclick=e=>{const k=ws.findIndex(x=>x.el==e.target);go(o.i,Math.max(0,k))};S.push(o);pe.append(se,i<a.length-1?' ':'')});box.append(pe)});
 cur=Math.min(s,Math.max(0,S.length-1));cw=w;box.scrollTop=0;mark(true);$('#bPg').textContent=`Pág. ${B.page+1} / ${B.pages}`;B.last=Date.now();B.s=cur;B.w=cw;saveProg(B);
}
function mark(sc){
 document.querySelectorAll('.cs,.cw').forEach(e=>e.classList.remove('cs','cw'));const s=S[cur];if(!s)return;s.el.classList.add('cs');const w=s.words[cw];w?.el.classList.add('cw');
 B.s=cur;B.w=cw;saveProg(B);if(!$('#asc').checked)return;
 const e=sc?s.el:w?.el,r=e?.getBoundingClientRect(),bx=$('#txt').getBoundingClientRect();
 if(r&&(sc||r.top<bx.top+bx.height*.15||r.bottom>bx.top+bx.height*.6))e.scrollIntoView({block:'center',behavior:'smooth'});
}
function say(i,w=0){
 if(i>=S.length){if(B.page<B.pages-1)return showPage(B.page+1).then(()=>play());return stop()}
 cur=i;cw=w;mark(w==0);const s=S[i],base=s.words[w]?.st||0,u=new SpeechSynthesisUtterance(s.text.slice(base)),t=++tok;let got=0;
 u.lang='es-MX';const v=voices().find(x=>x.voiceURI==st('voz'));if(v){u.voice=v;u.lang=v.lang}u.rate=rate;
 u.onboundary=e=>{if(t!=tok||(e.name&&e.name!='word'))return;got=1;const c=e.charIndex+base;let k=s.words.findIndex(x=>x.st>c);k=k<0?s.words.length-1:k-1;if(k!=cw){cw=Math.max(0,k);mark()}};
 u.onend=()=>{if(t==tok&&playing)say(i+1)};u.onerror=e=>{if(t==tok&&!/interrupted|canceled/.test(e.error)){stop();toast('Error de voz: '+e.error)}};
 speechSynthesis.cancel();speechSynthesis.speak(u);
 // Android a veces no envía "boundary": se estima la palabra por tiempo
 clearInterval(est);const t0=Date.now();est=setInterval(()=>{if(t!=tok||got)return clearInterval(est);const el=(Date.now()-t0-600)/1000*15*rate;if(el<0)return;let k=s.words.findIndex(x=>x.st>base+el);k=k<0?s.words.length-1:Math.max(k-1,w);if(k!=cw){cw=k;mark()}},120);
}
const play=()=>{playing=true;running=true;$('#play').textContent='⏸';say(cur,cw)};
function stop(){playing=false;tok++;clearInterval(est);speechSynthesis.cancel();running=false;$('#play').textContent='▶'}
const go=(i,w=0)=>{playing=true;running=true;$('#play').textContent='⏸';say(i,w)};
$('#play').onclick=()=>playing?stop():play();
$('#sNext').onclick=()=>{const p=playing;cur=Math.min(S.length-1,cur+1);cw=0;mark(true);if(p)go(cur)};
$('#sPrev').onclick=()=>{const p=playing;cur=Math.max(0,cur-1);cw=0;mark(true);if(p)go(cur)};
const turn=async d=>{const p=playing;await showPage(B.page+d);if(p)play()};
$('#pNext').onclick=()=>turn(1);$('#pPrev').onclick=()=>turn(-1);
// cronómetro: corre mientras la voz lee; tocar el reloj lo activa/pausa para leer sin voz
function clock(){if(running&&!document.hidden){B.secs++;sess++;if(B.secs%5==0)saveProg(B);const d=st('days',{}),k=new Date().toLocaleDateString('en-CA');d[k]=(d[k]||0)+1;if(B.secs%10==0)sv('days',d)}
 $('#clk').className=running?'run':'';$('#clk').textContent=`${running?'●':'❚❚'} Sesión ${fmt(sess)} · Total del libro ${fmt(B.secs)}`}
$('#clk').onclick=()=>{running=!running;clock()};
async function close(){stop();clearInterval(tick);saveProg(B);await put('books',B);doc?.destroy();doc=epub=null;view('lib');render()}
$('#bBack').onclick=close;
addEventListener('pagehide',()=>{if(B&&$('#rd').classList.contains('on'))saveProg(B)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&B)put('books',B)});
// velocidad
const setRate=v=>{rate=+v;sv('rate',rate);$('#rv').textContent=rate.toFixed(1)+'×'};$('#rate').value=rate;setRate(rate);
$('#rate').oninput=e=>setRate(e.target.value);$('#rate').onchange=()=>{if(playing)say(cur,cw)};
// ir a página
$('#bPg').onclick=()=>{const n=B.page+1;$('#pgn').max=$('#pgr').max=B.pages;$('#pgn').value=$('#pgr').value=n;$('#pgl').textContent='Libro de '+B.pages+' páginas';
 $('#chp').innerHTML=epub?.chap?.length>1?'<label>Capítulos</label><select id="cs"><option value="">Elegir…</option>'+epub.chap.map(c=>`<option value="${c.p+1}">${c.t}</option>`).join('')+'</select>':'';
 $('#cs')&&($('#cs').onchange=e=>{if(e.target.value)$('#pgn').value=$('#pgr').value=e.target.value});$('#dPg').showModal()};
$('#pgn').oninput=e=>$('#pgr').value=e.target.value;$('#pgr').oninput=e=>$('#pgn').value=e.target.value;
$('#pgGo').onclick=()=>{$('#dPg').close();const p=playing;showPage(+$('#pgn').value-1).then(()=>p&&play())};
// ajustes
const voices=()=>speechSynthesis.getVoices();
function fillVoices(){const all=voices(),es=all.filter(v=>/^es/i.test(v.lang)),l=es.length?es:all;$('#voz').innerHTML=l.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');const s=st('voz');if(s&&l.some(v=>v.voiceURI==s))$('#voz').value=s;else if(l[0])sv('voz',l.find(v=>/MX|US/.test(v.lang))?.voiceURI||l[0].voiceURI),$('#voz').value=st('voz')}
speechSynthesis.onvoiceschanged=fillVoices;fillVoices();
$('#voz').onchange=e=>{sv('voz',e.target.value);if(playing)say(cur,cw)};
$('#bSet').onclick=()=>$('#dSet').showModal();
const fs=d=>{const v=Math.max(14,Math.min(36,st('fs',20)+d));sv('fs',v);document.documentElement.style.setProperty('--fs',v+'px')};fs(0);
$('#fm').onclick=()=>fs(-2);$('#fp').onclick=()=>fs(2);
render();
</script></body></html>
